<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transfer AFC Token</title>

  <!-- Make sure ethers.js is included at the top -->
  <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.min.js"></script>
</head>
<body>
  <h1>AFC Token Transfer (MetaMask)</h1>

  <p>Connected: <span id="connectedAccount">Not connected</span></p>
  <br><br>

  <label for="recipientAddress">Recipient Address:</label>
  <input type="text" id="recipientAddress" placeholder="Recipient Address" required><br><br>

  <label for="amount">Amount to Transfer:</label>
  <input type="number" id="amount" placeholder="Amount (in AFC)" required><br><br>

  <button onclick="transferAFC()">Transfer AFC</button>

  <p id="transactionStatus"></p>

  <script>
    const contractAddress = "0xb518Ff71b149Bcb9831334414D46094dff96bB89";
    const afcContractABI = [
      "function balanceOf(address) view returns (uint256)",
      "function transfer(address recipient, uint256 amount) returns (bool)"
    ];

    let provider, signer, connectedAccount;

    async function connectWallet() {
      if (!window.ethereum) {
        document.getElementById("connectedAccount").textContent = "MetaMask not installed. Please install MetaMask.";
        return;
      }
      try {
        provider = new ethers.providers.Web3Provider(window.ethereum);
        await provider.send("eth_requestAccounts", []);
        signer = provider.getSigner();
        connectedAccount = await signer.getAddress();
        document.getElementById("connectedAccount").textContent = connectedAccount;
      } catch (e) {
        document.getElementById("connectedAccount").textContent =
          e.code === 4001
            ? "Connection rejected. Please open MetaMask and connect."
            : "Failed to connect wallet. Please open MetaMask and connect your account.";
      }
    }

    window.addEventListener("load", connectWallet);

    if (window.ethereum) {
      window.ethereum.on("accountsChanged", () => connectWallet());
    }

    async function transferAFC() {
      if (!signer) {
        alert("Connect MetaMask first!");
        return;
      }

      const recipientAddress = document.getElementById("recipientAddress").value;
      const amount = document.getElementById("amount").value;

      if (!ethers.utils.isAddress(recipientAddress)) {
        alert("Invalid recipient address!");
        return;
      }

      if (!amount || isNaN(amount) || amount <= 0) {
        alert("Invalid amount!");
        return;
      }

      const afcToken = new ethers.Contract(contractAddress, afcContractABI, signer);
      const transferAmount = ethers.utils.parseUnits(amount, 18);

      try {
        document.getElementById("transactionStatus").innerHTML = "Waiting for confirmation in MetaMask...";
        const tx = await afcToken.transfer(recipientAddress, transferAmount);
        document.getElementById("transactionStatus").innerHTML = `Tx sent: ${tx.hash}`;
        await tx.wait();
        document.getElementById("transactionStatus").innerHTML = `Confirmed! Tx: ${tx.hash}`;
        updateBalances(connectedAccount, recipientAddress);
      } catch (error) {
        console.error(error);
        document.getElementById("transactionStatus").innerHTML = "Transaction failed!";
      }
    }

    async function updateBalances(sender, recipient) {
      const afcToken = new ethers.Contract(contractAddress, afcContractABI, provider);
      const sb = await afcToken.balanceOf(sender);
      const rb = await afcToken.balanceOf(recipient);
      console.log(`Sender: ${ethers.utils.formatUnits(sb, 18)} AFC`);
      console.log(`Recipient: ${ethers.utils.formatUnits(rb, 18)} AFC`);
    }
  </script>
</body>
</html>
