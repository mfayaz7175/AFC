<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transfer AFC Token</title>

  <!-- Make sure ethers.js is included at the top -->
  <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.min.js"></script>
</head>
<body>
  <h1>Transfer AFC Token</h1>

  <label for="senderAddress">Sender Address:</label>
  <input type="text" id="senderAddress" placeholder="Sender Address" required><br><br>

  <label for="recipientAddress">Recipient Address:</label>
  <input type="text" id="recipientAddress" placeholder="Recipient Address" required><br><br>

  <label for="amount">Amount to Transfer:</label>
  <input type="number" id="amount" placeholder="Amount (in AFC)" required><br><br>

  <button onclick="transferAFC()">Transfer AFC</button>

  <p id="transactionStatus"></p>

  <script>
    // Ganache Network Configuration
    const provider = new ethers.JsonRpcProvider("http://127.0.0.1:8545"); // Ganache default RPC URL
    const contractAddress = "0x0471B72Fe3a1e1350800DAA5AEbbBa319C679b03"; // Your deployed contract address
    const afcContractABI = [
      // Only including relevant functions
      "function balanceOf(address) view returns (uint256)",
      "function transfer(address recipient, uint256 amount) public returns (bool)"
    ];

    // Function to transfer AFC
    async function transferAFC() {
      const senderAddress = document.getElementById("senderAddress").value;
      const recipientAddress = document.getElementById("recipientAddress").value;
      const amount = document.getElementById("amount").value;

      if (!ethers.utils.isAddress(senderAddress) || !ethers.utils.isAddress(recipientAddress)) {
        alert("Invalid address format!");
        return;
      }

      if (!amount || isNaN(amount) || amount <= 0) {
        alert("Invalid amount!");
        return;
      }

      // Create a contract instance
      const afcToken = new ethers.Contract(contractAddress, afcContractABI, provider);

      // Fetch the sender's signer (private key should be unlocked in Ganache)
      const senderSigner = provider.getSigner(senderAddress);

      // Transfer amount in AFC (convert to Wei)
      const transferAmount = ethers.utils.parseUnits(amount, 18);

      try {
        // Trigger the transaction
        const tx = await afcToken.connect(senderSigner).transfer(recipientAddress, transferAmount);
        document.getElementById("transactionStatus").innerHTML = `Transaction hash: ${tx.hash}`;

        // Wait for the transaction to be mined
        await tx.wait();
        document.getElementById("transactionStatus").innerHTML = `Transaction confirmed! Hash: ${tx.hash}`;

        // Optionally, update the balances after transfer
        updateBalances(senderAddress, recipientAddress);

      } catch (error) {
        console.error("Transaction failed:", error);
        document.getElementById("transactionStatus").innerHTML = "Transaction failed! Check console for details.";
      }
    }

    // Function to update sender and recipient balances after the transfer
    async function updateBalances(senderAddress, recipientAddress) {
      const afcToken = new ethers.Contract(contractAddress, afcContractABI, provider);

      try {
        const senderBalance = await afcToken.balanceOf(senderAddress);
        const recipientBalance = await afcToken.balanceOf(recipientAddress);

        console.log(`Sender balance after transfer: ${ethers.utils.formatUnits(senderBalance, 18)} AFC`);
        console.log(`Recipient balance after transfer: ${ethers.utils.formatUnits(recipientBalance, 18)} AFC`);
      } catch (error) {
        console.error("Error fetching balances:", error);
      }
    }
  </script>
</body>
</html>
